name: Wire Working FX and Melody Studio
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[fx-melody-wired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch MainActivity
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/example/MainActivity.kt')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              'DJPadButton("Flanger", deck.isFlangerActive) { deck.isFlangerActive = !deck.isFlangerActive }',
              'DJPadButton("Flanger", deck.isFlangerActive) { deck.toggleFlanger() }'
          )
          s = s.replace(
              'DJPadButton("Reverb", deck.isReverbActive) { deck.isReverbActive = !deck.isReverbActive }',
              'DJPadButton("Reverb", deck.isReverbActive) { deck.toggleReverb() }'
          )
          s = s.replace(
              'DJPadButton("Echo", deck.isEchoActive) { deck.isEchoActive = !deck.isEchoActive }',
              'DJPadButton("Echo", deck.isEchoActive) { deck.toggleEcho() }'
          )
          s = s.replace(
              'DJPadButton("Crush", deck.isCrushActive) { deck.isCrushActive = !deck.isCrushActive }',
              'DJPadButton("Crush", deck.isCrushActive) { deck.toggleCrush() }'
          )

          marker = '''        }\n    }\n}\n\n@Composable\nfun DJPadButton'''
          insertion = '''        }\n\n        Spacer(modifier = Modifier.height(16.dp))\n\n        MelodyStudioCard(audioLibrary = audioLibrary, context = LocalContext.current)\n    }\n}\n\n@Composable\nfun DJPadButton'''
          if 'MelodyStudioCard(audioLibrary = audioLibrary' not in s:
              s = s.replace(marker, insertion, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/MainActivity.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: wire working deck FX and melody studio [fx-melody-wired]"
          git push
