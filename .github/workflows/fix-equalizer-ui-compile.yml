name: Fix Equalizer UI Compile Issues

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[eq-ui-compile-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix compile expression
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/src/main/java/com/example/MainActivity.kt')
          text = path.read_text(encoding='utf-8')
          fixed = text.replace('eqController.updateBandLevel(index, newVal.roundToInt())', 'eqController.updateBandLevel(index, newVal.toInt())')
          if fixed != text:
              path.write_text(fixed, encoding='utf-8')
              print('Fixed missing roundToInt import dependency')
          else:
              print('No compile fix needed')

      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/MainActivity.kt
          git commit -m "ci: fix equalizer UI rounding expression [eq-ui-compile-fix]"
          git push
