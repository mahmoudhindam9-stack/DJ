name: Apply Equalizer UI Enhancements

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[equalizer-ui-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Equalizer UI
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/example/MainActivity.kt')
          text = path.read_text(encoding='utf-8')

          equalizer_start = text.find('@Composable\nfun EqualizerScreen(eqController: EqualizerController) {')
          fader_start = text.find('@Composable\nfun VerticalFader(', equalizer_start)
          if equalizer_start < 0 or fader_start < 0:
              raise SystemExit('Equalizer UI markers not found')

          equalizer_block = r'''@Composable
          fun EqualizerScreen(eqController: EqualizerController) {
              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(16.dp)
              ) {
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Column {
                          Text(
                              text = "Detailed Equalizer",
                              style = MaterialTheme.typography.headlineMedium,
                              fontWeight = FontWeight.Bold
                          )
                          Text(
                              text = "10-Band Audio Frequency Processor",
                              style = MaterialTheme.typography.bodySmall,
                              color = MaterialTheme.colorScheme.onSurfaceVariant
                          )
                      }
                      Switch(
                          checked = eqController.isEnabled,
                          onCheckedChange = { eqController.toggleEnable() }
                      )
                  }

                  Spacer(modifier = Modifier.height(16.dp))

                  Text("EQ Presets", style = MaterialTheme.typography.titleSmall, fontWeight = FontWeight.Bold)
                  Spacer(modifier = Modifier.height(6.dp))
                  LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      items(eqController.presets) { preset ->
                          FilterChip(
                              selected = eqController.selectedPreset == preset,
                              onClick = { eqController.applyPreset(preset) },
                              label = { Text(preset) }
                          )
                      }
                  }

                  Spacer(modifier = Modifier.height(18.dp))

                  Card(
                      modifier = Modifier
                          .fillMaxWidth()
                          .weight(1f),
                      colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surfaceVariant)
                  ) {
                      Column(
                          modifier = Modifier
                              .fillMaxSize()
                              .padding(12.dp),
                          horizontalAlignment = Alignment.CenterHorizontally
                      ) {
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Text(
                                  text = "10-BAND EQ (dB GAIN)",
                                  style = MaterialTheme.typography.labelMedium,
                                  fontWeight = FontWeight.Bold,
                                  color = MaterialTheme.colorScheme.primary
                              )
                              Text(
                                  text = if (eqController.isEnabled) "ACTIVE" else "BYPASSED (High Quality)",
                                  style = MaterialTheme.typography.labelSmall,
                                  color = if (eqController.isEnabled) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.onSurfaceVariant
                              )
                          }

                          Spacer(modifier = Modifier.height(12.dp))

                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .weight(1f),
                              horizontalArrangement = Arrangement.SpaceEvenly,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              eqController.bands.forEachIndexed { index, band ->
                                  Column(
                                      horizontalAlignment = Alignment.CenterHorizontally,
                                      modifier = Modifier
                                          .weight(1f)
                                          .fillMaxHeight(),
                                      verticalArrangement = Arrangement.SpaceBetween
                                  ) {
                                      Text(
                                          text = if (band.currentLevelDb > 0) "+${band.currentLevelDb}" else "${band.currentLevelDb}",
                                          style = MaterialTheme.typography.labelSmall,
                                          fontSize = 9.sp,
                                          fontWeight = FontWeight.Bold
                                      )

                                      VerticalFader(
                                          value = band.currentLevelDb.toFloat(),
                                          onValueChange = { newVal ->
                                              eqController.updateBandLevel(index, newVal.roundToInt())
                                          },
                                          modifier = Modifier
                                              .weight(1f)
                                              .fillMaxHeight()
                                      )

                                      Text(
                                          text = band.name,
                                          style = androidx.compose.ui.text.TextStyle(fontSize = 8.sp),
                                          fontWeight = FontWeight.Bold,
                                          maxLines = 1
                                      )
                                  }
                              }
                          }
                      }
                  }

                  Spacer(modifier = Modifier.height(14.dp))

                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface)
                  ) {
                      Column(modifier = Modifier.padding(16.dp)) {
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween
                          ) {
                              Text("BASS BOOST", style = MaterialTheme.typography.labelMedium, fontWeight = FontWeight.Bold)
                              Text(
                                  "${(eqController.bassBoostLevel * 100).toInt()}%",
                                  style = MaterialTheme.typography.labelSmall,
                                  fontWeight = FontWeight.Bold,
                                  color = MaterialTheme.colorScheme.primary
                              )
                          }
                          Slider(
                              value = eqController.bassBoostLevel,
                              onValueChange = { eqController.updateBassBoost(it) },
                              valueRange = 0f..1f,
                              modifier = Modifier.fillMaxWidth()
                          )
                      }
                  }

                  Spacer(modifier = Modifier.height(10.dp))

                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface)
                  ) {
                      Column(modifier = Modifier.padding(16.dp)) {
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween
                          ) {
                              Text("TREBLE BOOST", style = MaterialTheme.typography.labelMedium, fontWeight = FontWeight.Bold)
                              Text(
                                  "${(eqController.trebleBoostLevel * 100).toInt()}%",
                                  style = MaterialTheme.typography.labelSmall,
                                  fontWeight = FontWeight.Bold,
                                  color = MaterialTheme.colorScheme.primary
                              )
                          }
                          Slider(
                              value = eqController.trebleBoostLevel,
                              onValueChange = { eqController.updateTrebleBoost(it) },
                              valueRange = 0f..1f,
                              modifier = Modifier.fillMaxWidth()
                          )
                      }
                  }
              }
          }

          '''
          # Remove indentation introduced by the raw string wrapper.
          equalizer_block = '\n'.join(line[10:] if line.startswith('          ') else line for line in equalizer_block.splitlines()) + '\n'

          fader_block = r'''@Composable
          fun VerticalFader(
              value: Float,
              onValueChange: (Float) -> Unit,
              modifier: Modifier = Modifier
          ) {
              val latestValue by rememberUpdatedState(value)

              Box(
                  modifier = modifier
                      .fillMaxHeight()
                      .width(44.dp)
                      .pointerInput(Unit) {
                          detectVerticalDragGestures { change, dragAmount ->
                              change.consume()
                              val height = size.height.toFloat()
                              if (height > 0f) {
                                  // Keep a live working value for the current gesture.
                                  // This makes the fader accumulate movement like a normal Slider.
                                  val current = latestValue
                                  val delta = -dragAmount / height * 24f
                                  onValueChange((current + delta).coerceIn(-12f, 12f))
                              }
                          }
                      }
                      .pointerInput(Unit) {
                          detectTapGestures { offset ->
                              val height = size.height.toFloat()
                              if (height > 0f) {
                                  val fraction = 1f - (offset.y / height)
                                  val newVal = (-12f + fraction * 24f).coerceIn(-12f, 12f)
                                  onValueChange(newVal)
                              }
                          }
                      },
                  contentAlignment = Alignment.Center
              ) {
                  Box(
                      modifier = Modifier
                          .width(6.dp)
                          .fillMaxHeight(0.85f)
                          .background(MaterialTheme.colorScheme.surface, RoundedCornerShape(3.dp))
                  )
                  Box(
                      modifier = Modifier
                          .width(14.dp)
                          .height(2.dp)
                          .background(MaterialTheme.colorScheme.onSurfaceVariant.copy(alpha = 0.5f))
                  )

                  val fraction = ((latestValue + 12f) / 24f).coerceIn(0f, 1f)
                  BoxWithConstraints(
                      modifier = Modifier
                          .fillMaxHeight(0.85f)
                          .width(44.dp),
                      contentAlignment = Alignment.BottomCenter
                  ) {
                      val trackH = maxHeight
                      val thumbY = trackH * fraction - 14.dp
                      Box(
                          modifier = Modifier
                              .size(28.dp)
                              .offset(y = -thumbY)
                              .shadow(4.dp, CircleShape)
                              .background(MaterialTheme.colorScheme.primary, CircleShape),
                          contentAlignment = Alignment.Center
                      ) {
                          Box(
                              modifier = Modifier
                                  .size(8.dp)
                                  .background(MaterialTheme.colorScheme.onPrimary, CircleShape)
                          )
                      }
                  }
              }
          }
          '''
          fader_block = '\n'.join(line[10:] if line.startswith('          ') else line for line in fader_block.splitlines()) + '\n'

          new_text = text[:equalizer_start] + equalizer_block + fader_block

          if new_text == text:
              print('No UI changes needed')
          else:
              path.write_text(new_text, encoding='utf-8')
              print('Equalizer UI patched')

      - name: Commit patched source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/MainActivity.kt
          git commit -m "feat: smooth equalizer faders and add treble booster [equalizer-ui-patch]"
          git push
