name: Auto Build & Release APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.github/**'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Read Version Name
        id: version
        run: |
          # Use the app's own versionName (from app/build.gradle.kts) as the
          # release tag instead of a raw timestamp. A timestamp is always
          # numerically "greater" than the installed app's static version,
          # so the in-app update checker would think a new release is always
          # available and keep re-downloading the same build forever.
          # Bump versionName in app/build.gradle.kts before pushing a release
          # you actually want users to be prompted to install.
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION="v$VERSION_NAME"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Rename APK
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            mv app/build/outputs/apk/debug/app-debug.apk app-update.apk
          else
            echo "APK not found! Check your build logs."
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: "Automated release generated by GitHub Actions on push to main branch."
          files: app-update.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
