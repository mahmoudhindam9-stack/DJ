name: Auto Build & Release APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.github/**'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Read Version Name
        id: version
        run: |
          # Use the app's own versionName (from app/build.gradle.kts) as the
          # release tag instead of a raw timestamp. A timestamp is always
          # numerically "greater" than the installed app's static version,
          # so the in-app update checker would think a new release is always
          # available and keep re-downloading the same build forever.
          # Bump versionName in app/build.gradle.kts before pushing a release
          # you actually want users to be prompted to install.
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION="v$VERSION_NAME"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Rename APK
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            mv app/build/outputs/apk/debug/app-debug.apk app-update.apk
          else
            echo "APK not found! Check your build logs."
            exit 1
          fi

      - name: Check if Release Exists
        id: check_release
        run: |
          if gh release view ${{ steps.version.outputs.version }} > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release ${{ steps.version.outputs.version }} already exists. Skipping release creation to avoid immutable tag errors."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release ${{ steps.version.outputs.version }} does not exist. Proceeding with creation."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        if: steps.check_release.outputs.exists == 'false'
        run: |
          gh release create ${{ steps.version.outputs.version }} app-update.apk --title "Release ${{ steps.version.outputs.version }}" --notes "Automated release generated by GitHub Actions on push to main branch."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
