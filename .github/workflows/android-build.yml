name: Android Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # The microphone normalizer is only needed for repositories that still have
      # the pre-normalized Beat FX state. This prevents an old patch script from
      # running again against already-normalized source.
      - name: Normalize microphone source when needed
        shell: bash
        run: |
          if grep -q 'var beatFxEnabled by mutableStateOf(true)' app/src/main/java/com/example/player/MicController.kt; then
            echo "Microphone source already normalized."
          else
            python3 .github/normalize_mic_source.py
          fi

      - name: Normalize studio, notification and widget integration
        run: python3 .github/normalize_studio_main.py

      - name: Commit generated source normalization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app/src/main .github
          if git diff --cached --quiet; then
            echo "Generated source already normalized."
          else
            git commit -m "ci: normalize app source integrations [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DJ-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Record successful Android build
        shell: bash
        run: |
          printf 'SUCCESS\nCommit: %s\nWorkflow: Android Build Verification\nArtifact: DJ-debug-apk\n' "$GITHUB_SHA" > .github/android-build-success.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/android-build-success.txt
          git commit -m "ci: record successful Android build [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
