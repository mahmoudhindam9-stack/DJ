name: Android Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Normalizers affect only this checkout. They never push generated files
      # back to main, so simultaneous builds cannot create rebase conflicts.
      - name: Normalize microphone source when needed
        shell: bash
        run: |
          if grep -q 'var beatFxEnabled by mutableStateOf(true)' app/src/main/java/com/example/player/MicController.kt; then
            echo "Microphone source already normalized."
          else
            python3 .github/normalize_mic_source.py
          fi

      - name: Normalize studio, notification and widget integration
        run: python3 .github/normalize_studio_main.py

      - name: Integrate Mixxx-inspired DJ FX rack
        run: python3 .github/upgrade_dj_fx_rack.py

      - name: Verify equalizer isolation
        shell: bash
        run: |
          test -f app/src/main/java/com/example/player/EqualizerScreen.kt
          test -f app/src/main/java/com/example/player/EqualizerController.kt
          test ! -f app/src/main/java/com/example/player/ProEqualizerScreen.kt
          grep -q 'The native Equalizer effect is created only after the user enables it' app/src/main/java/com/example/player/EqualizerController.kt
          grep -q 'if (!isEnabled) return' app/src/main/java/com/example/player/EqualizerController.kt
          grep -q 'fun EqualizerScreen(eqController: EqualizerController)' app/src/main/java/com/example/player/EqualizerScreen.kt
          echo "Equalizer isolation verification passed."

      - name: Verify DJ FX rack integration
        shell: bash
        run: |
          test -f app/src/main/java/com/example/DJFxRackScreen.kt
          grep -q 'DJ_FX_RACK_V1' app/src/main/java/com/example/MainActivity.kt
          grep -q 'DJEffect.values().size' app/src/main/java/com/example/DJFxRackScreen.kt
          echo "DJ FX rack verification passed."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DJ-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Verify release APK exists
        shell: bash
        run: |
          test -n "$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          echo "Release APK verification passed."

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: DJ-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
