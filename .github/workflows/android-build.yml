name: Android Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # One idempotent normalization pass. The build no longer replays a chain
      # of historical source-mutating patches on every run.
      - name: Normalize microphone source
        run: python3 .github/normalize_mic_source.py

      - name: Commit normalized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/MainActivity.kt \
                  app/src/main/java/com/example/player/MicController.kt
          if git diff --cached --quiet; then
            echo "Source already normalized."
          else
            git commit -m "ci: normalize microphone source [skip ci]"
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DJ-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Record successful Android build
        shell: bash
        run: |
          printf 'SUCCESS\nCommit: %s\nWorkflow: Android Build Verification\nArtifact: DJ-debug-apk\n' "$GITHUB_SHA" > .github/android-build-success.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/android-build-success.txt
          git commit -m "ci: record successful Android build [skip ci]"
          git push origin HEAD:main
