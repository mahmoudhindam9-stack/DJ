name: Android Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Apply DJ page layout polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/MainActivity.kt")
          s = p.read_text(encoding="utf-8")
          marker = "        // Maqamat & Oriental Taqasim Section"
          if "// DJ_PAGE_LAYOUT_V1" not in s:
              insert = '''        // DJ_PAGE_LAYOUT_V1\n        // Crossfader remains directly below Deck A & Deck B.\n        // Keep the library counter compact and horizontal rather than stacked vertically.\n        Card(\n            modifier = Modifier.fillMaxWidth(),\n            colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surfaceVariant)\n        ) {\n            Row(\n                modifier = Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 10.dp),\n                verticalAlignment = Alignment.CenterVertically,\n                horizontalArrangement = Arrangement.SpaceBetween\n            ) {\n                Row(verticalAlignment = Alignment.CenterVertically) {\n                    Icon(Icons.Filled.QueueMusic, contentDescription = null, modifier = Modifier.size(20.dp))\n                    Spacer(Modifier.width(8.dp))\n                    Text("SONG COUNTER", fontWeight = FontWeight.Bold, style = MaterialTheme.typography.labelMedium)\n                }\n                Text(\n                    "${audioLibrary.size} SONGS",\n                    fontWeight = FontWeight.Bold,\n                    color = MaterialTheme.colorScheme.primary,\n                    style = MaterialTheme.typography.titleSmall\n                )\n            }\n        }\n\n'''
              if marker not in s:
                  raise SystemExit("DJ layout marker not found")
              s = s.replace(marker, insert + marker, 1)
              p.write_text(s, encoding="utf-8")
          PY
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon
      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon
      - name: Verify release APK exists
        shell: bash
        run: test -n "$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DJ-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
