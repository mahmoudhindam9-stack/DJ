name: Android Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Restore complete Player and DJ screens baseline
        run: python3 .github/restore_main_screens.py

      - name: Persist Karaoke UI and DJ effects upgrade
        run: python3 .github/upgrade_karaoke.py

      - name: Persist audio input/output routing upgrade
        run: python3 .github/fix_audio_routing.py

      - name: Fix audio device classification and Bluetooth routing
        run: python3 .github/fix_device_routing.py

      - name: Persist expanded DJ effects engine
        run: python3 .github/expand_dj_effects.py

      - name: Persist safe EQ and Dolby integration
        run: python3 .github/upgrade_equalizer_dolby.py

      - name: Remove Melody Studio completely
        run: python3 .github/remove_melody_studio.py

      - name: Commit app upgrades
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/MainActivity.kt \
                  app/src/main/java/com/example/player/MicController.kt \
                  app/src/main/java/com/example/player/EqualizerController.kt \
                  app/src/main/java/com/example/player/DJDeckController.kt \
                  app/src/main/java/com/example/player/MusicService.kt \
                  app/src/main/java/com/example/widget/MusicWidgetProvider.kt \
                  app/src/main/java/com/example/NotificationControlScreen.kt
          if git diff --cached --quiet; then
            echo "No generated source changes to commit."
          else
            git commit -m "feat: finalize karaoke routing EQ Dolby DJ effects and external controls [skip ci]"
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DJ-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
