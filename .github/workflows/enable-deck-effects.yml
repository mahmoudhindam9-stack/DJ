name: Wire Real DJ FX And Melody
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[dj-fx-melody-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Wire the four Deck FX buttons to a real Media3 PCM processor.
          p = Path('app/src/main/java/com/example/player/DJDeckController.kt')
          s = p.read_text(encoding='utf-8')

          imports_old = 'import androidx.media3.exoplayer.ExoPlayer\n'
          imports_new = '''import androidx.media3.exoplayer.ExoPlayer
import androidx.media3.exoplayer.DefaultRenderersFactory
import androidx.media3.exoplayer.audio.AudioSink
import androidx.media3.exoplayer.audio.DefaultAudioSink
import androidx.media3.common.util.UnstableApi
'''
          if 'import androidx.media3.exoplayer.DefaultRenderersFactory' not in s:
              s = s.replace(imports_old, imports_new, 1)

          player_old = '''class DJDeck(context: Context, val deckName: String) {
    val exoPlayer: ExoPlayer = ExoPlayer.Builder(context).build()
'''
          player_new = '''@OptIn(UnstableApi::class)
class DJDeck(context: Context, val deckName: String) {
    private val fxProcessor = DeckFxAudioProcessor()

    private val renderersFactory = object : DefaultRenderersFactory(context) {
        override fun buildAudioSink(
            context: Context,
            enableFloatOutput: Boolean,
            enableAudioTrackPlaybackParams: Boolean,
            enableOffload: Boolean
        ): AudioSink {
            return DefaultAudioSink.Builder(context)
                .setEnableFloatOutput(false)
                .setEnableAudioTrackPlaybackParams(enableAudioTrackPlaybackParams)
                .setEnableOffload(enableOffload)
                .setAudioProcessors(arrayOf(fxProcessor))
                .build()
        }
    }

    val exoPlayer: ExoPlayer = ExoPlayer.Builder(context, renderersFactory).build()
'''
          if player_old in s:
              s = s.replace(player_old, player_new, 1)

          fx_marker = '    var isCrushActive by mutableStateOf(false)\n'
          fx_methods = '''
    fun toggleFlanger() {
        isFlangerActive = !isFlangerActive
        fxProcessor.flangerEnabled = isFlangerActive
    }

    fun toggleReverb() {
        isReverbActive = !isReverbActive
        fxProcessor.reverbEnabled = isReverbActive
    }

    fun toggleEcho() {
        isEchoActive = !isEchoActive
        fxProcessor.echoEnabled = isEchoActive
    }

    fun toggleCrush() {
        isCrushActive = !isCrushActive
        fxProcessor.crushEnabled = isCrushActive
    }
'''
          if 'fun toggleFlanger()' not in s and fx_marker in s:
              s = s.replace(fx_marker, fx_marker + fx_methods, 1)

          speed_old = '''    fun setPitchAndSpeed(newRate: Float) {
        pitchSpeed = newRate.coerceIn(0.5f, 1.5f)
        var effectiveSpeed = pitchSpeed
        if (isFlangerActive) {
            effectiveSpeed *= 1.02f
        }
        exoPlayer.playbackParameters = PlaybackParameters(effectiveSpeed, effectiveSpeed)
    }

    fun setDeckVolume(vol: Float) {
        volume = vol.coerceIn(0f, 1f)
        var effVol = volume
        if (isEchoActive) {
            effVol = (effVol * 1.15f).coerceAtMost(1f)
        }
        if (isCrushActive) {
            effVol *= 0.9f
        }
        exoPlayer.volume = effVol
    }
'''
          speed_new = '''    fun setPitchAndSpeed(newRate: Float) {
        pitchSpeed = newRate.coerceIn(0.5f, 1.5f)
        exoPlayer.playbackParameters = PlaybackParameters(pitchSpeed, pitchSpeed)
    }

    fun setDeckVolume(vol: Float) {
        volume = vol.coerceIn(0f, 1f)
        exoPlayer.volume = volume
    }
'''
          if speed_old in s:
              s = s.replace(speed_old, speed_new, 1)

          cross_old = '''        deckA.exoPlayer.volume = if (deckA.isEchoActive) (volA * 1.15f).coerceAtMost(1f) else volA
        deckB.exoPlayer.volume = if (deckB.isEchoActive) (volB * 1.15f).coerceAtMost(1f) else volB
'''
          cross_new = '''        deckA.exoPlayer.volume = volA
        deckB.exoPlayer.volume = volB
'''
          if cross_old in s:
              s = s.replace(cross_old, cross_new, 1)

          mixer_marker = '''    fun pauseAll() {
        deckA.pause()
        deckB.pause()
    }
'''
          mixer_method = '''    fun playMelodyOverDeckA(melody: AudioItem): Boolean {
        if (deckA.track == null) return false

        deckB.loadTrack(melody)
        deckA.exoPlayer.volume = deckA.volume
        deckB.exoPlayer.volume = deckB.volume
        deckA.exoPlayer.play()
        deckB.exoPlayer.play()
        return true
    }
'''
          if 'fun playMelodyOverDeckA' not in s and mixer_marker in s:
              s = s.replace(mixer_marker, mixer_marker + '\n' + mixer_method, 1)

          p.write_text(s, encoding='utf-8')

          # 2) Add a second bank of synthesized sounds; UI will render all entries.
          extra = Path('app/src/main/java/com/example/ExtraSoundPlayer.kt')
          if not extra.exists():
              extra.write_text(r'''package com.example

import android.media.AudioAttributes
import android.media.AudioFormat
import android.media.AudioTrack
import kotlin.math.PI
import kotlin.math.exp
import kotlin.math.sin
import kotlin.math.tanh

enum class ExtraSound(val title: String) {
    RIMSHOT("Rim Shot"), SNAP("Finger Snap"), MARACAS("Maracas"), CLAVE("Clave"),
    RIDE("Ride Cymbal"), SUB_KICK("Sub Kick"), PERC_CLICK("Perc Click"), BASS_PULSE("Bass Pulse"),
    IMPACT("Impact"), RISER("Riser"), DOWNLIFTER("Downlifter"), TELEPHONE("Telephone"),
    ROBOT("Robot Zap"), PIANO_PLUCK("Piano Pluck"), ORGAN("Organ Hit"), CHORD("Power Chord"),
    PERC_SHOUT("Perc Shout"), REVERSE("Reverse Sweep")
}

object ExtraSoundPlayer {
    private const val sampleRate = 44_100

    fun play(sound: ExtraSound) {
        Thread {
            try {
                val seconds = when (sound) {
                    ExtraSound.RIMSHOT, ExtraSound.SNAP, ExtraSound.CLAVE, ExtraSound.PERC_CLICK -> 0.22
                    ExtraSound.MARACAS -> 0.35
                    ExtraSound.RIDE -> 1.1
                    ExtraSound.SUB_KICK -> 0.65
                    ExtraSound.BASS_PULSE -> 0.45
                    ExtraSound.IMPACT -> 0.9
                    ExtraSound.RISER, ExtraSound.REVERSE -> 1.2
                    ExtraSound.DOWNLIFTER -> 0.9
                    ExtraSound.TELEPHONE -> 0.5
                    ExtraSound.ROBOT -> 0.35
                    ExtraSound.PIANO_PLUCK -> 0.6
                    ExtraSound.ORGAN, ExtraSound.CHORD -> 0.75
                    ExtraSound.PERC_SHOUT -> 0.4
                }
                val count = (sampleRate * seconds).toInt()
                val pcm = ShortArray(count)
                for (i in 0 until count) {
                    val t = i.toDouble() / sampleRate
                    val p = i.toDouble() / count
                    val noise = Math.random() * 2.0 - 1.0
                    val v = when (sound) {
                        ExtraSound.RIMSHOT -> (noise * exp(-p * 18.0) + sin(2.0 * PI * 1450.0 * t) * exp(-p * 28.0) * 0.7)
                        ExtraSound.SNAP -> noise * exp(-p * 24.0) * 0.8
                        ExtraSound.MARACAS -> noise * sin(PI * p) * 0.4
                        ExtraSound.CLAVE -> sin(2.0 * PI * 2200.0 * t) * exp(-p * 22.0) * 0.5
                        ExtraSound.RIDE -> (noise * 0.65 + sin(2.0 * PI * 3300.0 * t) * 0.35) * exp(-p * 3.4)
                        ExtraSound.SUB_KICK -> sin(2.0 * PI * (180.0 - 140.0 * p) * t) * exp(-p * 5.0)
                        ExtraSound.PERC_CLICK -> (noise * 0.7 + sin(2.0 * PI * 1800.0 * t) * 0.3) * exp(-p * 28.0)
                        ExtraSound.BASS_PULSE -> sin(2.0 * PI * (70.0 + 20.0 * sin(2.0 * PI * 3.0 * t)) * t) * sin(PI * p) * 0.75
                        ExtraSound.IMPACT -> (sin(2.0 * PI * (160.0 - 110.0 * p) * t) * 0.75 + noise * 0.25) * exp(-p * 4.5)
                        ExtraSound.RISER -> sin(2.0 * PI * (220.0 + 1700.0 * p) * t) * sin(PI * p) * 0.45
                        ExtraSound.DOWNLIFTER -> sin(2.0 * PI * (1800.0 - 1500.0 * p) * t) * exp(-p * 2.4) * 0.45
                        ExtraSound.TELEPHONE -> (sin(2.0 * PI * 900.0 * t) + sin(2.0 * PI * 1050.0 * t)) * 0.25 * (1.0 - p * 0.35)
                        ExtraSound.ROBOT -> tanh(sin(2.0 * PI * 120.0 * t) * 7.0) * exp(-p * 8.0) * 0.35
                        ExtraSound.PIANO_PLUCK -> (sin(2.0 * PI * 440.0 * t) + sin(2.0 * PI * 880.0 * t) * 0.25) * exp(-p * 4.5) * 0.45
                        ExtraSound.ORGAN -> (sin(2.0 * PI * 330.0 * t) + sin(2.0 * PI * 660.0 * t) * 0.45 + sin(2.0 * PI * 990.0 * t) * 0.2) * exp(-p * 2.2) * 0.25
                        ExtraSound.CHORD -> (sin(2.0 * PI * 220.0 * t) + sin(2.0 * PI * 277.18 * t) + sin(2.0 * PI * 329.63 * t)) * exp(-p * 3.2) * 0.25
                        ExtraSound.PERC_SHOUT -> (noise * 0.55 + sin(2.0 * PI * 520.0 * t) * 0.45) * sin(PI * p) * 0.65
                        ExtraSound.REVERSE -> sin(2.0 * PI * (1800.0 - 1500.0 * p) * t) * (p * p) * 0.5
                    }
                    pcm[i] = (v.coerceIn(-1.0, 1.0) * Short.MAX_VALUE).toInt().toShort()
                }

                val track = AudioTrack.Builder()
                    .setAudioAttributes(
                        AudioAttributes.Builder()
                            .setUsage(AudioAttributes.USAGE_MEDIA)
                            .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                            .build()
                    )
                    .setAudioFormat(
                        AudioFormat.Builder()
                            .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                            .setSampleRate(sampleRate)
                            .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                            .build()
                    )
                    .setBufferSizeInBytes(pcm.size * 2)
                    .setTransferMode(AudioTrack.MODE_STATIC)
                    .build()
                track.write(pcm, 0, pcm.size)
                track.play()
                Thread.sleep((seconds * 1000).toLong() + 40L)
                track.release()
            } catch (_: Throwable) { }
        }.start()
    }
}
''', encoding='utf-8')

          # 3) Patch MainActivity: real FX handlers, extra sound bank, and melody overlay.
          m = Path('app/src/main/java/com/example/MainActivity.kt')
          t = m.read_text(encoding='utf-8')
          replacements = {
              'DJPadButton("Flanger", deck.isFlangerActive) { deck.isFlangerActive = !deck.isFlangerActive }': 'DJPadButton("Flanger", deck.isFlangerActive) { deck.toggleFlanger() }',
              'DJPadButton("Reverb", deck.isReverbActive) { deck.isReverbActive = !deck.isReverbActive }': 'DJPadButton("Reverb", deck.isReverbActive) { deck.toggleReverb() }',
              'DJPadButton("Echo", deck.isEchoActive) { deck.isEchoActive = !deck.isEchoActive }': 'DJPadButton("Echo", deck.isEchoActive) { deck.toggleEcho() }',
              'DJPadButton("Crush", deck.isCrushActive) { deck.isCrushActive = !deck.isCrushActive }': 'DJPadButton("Crush", deck.isCrushActive) { deck.toggleCrush() }',
              'MelodyStudioCard(audioLibrary = audioLibrary, context = LocalContext.current)': 'MelodyStudioCard(audioLibrary = audioLibrary, context = LocalContext.current, djMixerController = djMixerController)'
          }
          for a, b in replacements.items():
              t = t.replace(a, b)

          mixer_anchor = '''        }\n    }\n}\n\n@Composable\nfun DJPadButton'''
          mixer_insert = '''        }\n\n        Spacer(modifier = Modifier.height(16.dp))\n        ExtraSoundsCard()\n    }\n}\n\n@Composable\nfun ExtraSoundsCard() {\n    Card(\n        modifier = Modifier.fillMaxWidth(),\n        colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surfaceVariant)\n    ) {\n        Column(modifier = Modifier.padding(12.dp)) {\n            Text("EXTRA SOUND BANK", style = MaterialTheme.typography.titleSmall, fontWeight = FontWeight.Bold)\n            Spacer(modifier = Modifier.height(8.dp))\n            val sounds = ExtraSound.values().toList()\n            sounds.chunked(4).forEach { row ->\n                Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {\n                    row.forEach { sound ->\n                        Button(\n                            onClick = { ExtraSoundPlayer.play(sound) },\n                            modifier = Modifier.weight(1f).height(42.dp),\n                            contentPadding = PaddingValues(2.dp),\n                            shape = RoundedCornerShape(8.dp)\n                        ) { Text(sound.title, fontSize = 9.sp, maxLines = 1, overflow = TextOverflow.Ellipsis) }\n                    }\n                }\n                Spacer(modifier = Modifier.height(6.dp))\n            }\n        }\n    }\n}\n\n@Composable\nfun DJPadButton'''
          if 'fun ExtraSoundsCard()' not in t and mixer_anchor in t:
              t = t.replace(mixer_anchor, mixer_insert, 1)
          m.write_text(t, encoding='utf-8')

          # 4) Upgrade Melody Studio with persistent exported melody + Deck A overlay.
          ms = Path('app/src/main/java/com/example/MelodyStudio.kt')
          mt = ms.read_text(encoding='utf-8')
          if 'import com.example.player.DJMixerController' not in mt:
              mt = mt.replace('import com.example.model.AudioItem\n', 'import com.example.model.AudioItem\nimport com.example.player.DJMixerController\n', 1)
          mt = mt.replace('fun MelodyStudioCard(audioLibrary: MutableList<AudioItem>, context: Context) {', 'fun MelodyStudioCard(audioLibrary: MutableList<AudioItem>, context: Context, djMixerController: DJMixerController) {')
          mt = mt.replace('    var lastExport by remember { mutableStateOf("") }\n', '    var lastExport by remember { mutableStateOf("") }\n    var lastExportedItem by remember { mutableStateOf<AudioItem?>(null) }\n')
          mt = mt.replace('                        lastExport = "تم حفظ ${item.title}"\n', '                        lastExport = "تم حفظ ${item.title}"\n                        lastExportedItem = item\n')
          needle = '''            Button(\n                onClick = {\n                    if (sequence.isNotEmpty()) {\n                        val item = MelodyAudio.export(context, audioLibrary, sequence)\n                        audioLibrary.add(item)\n                        lastExport = "تم حفظ ${item.title}"\n                        lastExportedItem = item\n                    }\n                },\n                modifier = Modifier.fillMaxWidth()\n            ) { Text("حفظ اللحن في مكتبة الأغاني") }\n'''
          addition = needle + '''\n            if (lastExportedItem != null) {\n                Spacer(modifier = Modifier.height(6.dp))\n                Button(\n                    onClick = { djMixerController.playMelodyOverDeckA(lastExportedItem!!) },\n                    modifier = Modifier.fillMaxWidth()\n                ) { Text("تشغيل اللحن فوق الأغنية في Deck A") }\n            }\n'''
          if 'تشغيل اللحن فوق الأغنية في Deck A' not in mt and needle in mt:
              mt = mt.replace(needle, addition, 1)
          ms.write_text(mt, encoding='utf-8')
          print('Patch completed')
          PY
      - name: Commit and clean up temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/player/DJDeckController.kt app/src/main/java/com/example/player/DeckFxAudioProcessor.kt app/src/main/java/com/example/MainActivity.kt app/src/main/java/com/example/MelodyStudio.kt app/src/main/java/com/example/ExtraSoundPlayer.kt
          git rm -f .github/workflows/enable-deck-effects.yml .github/workflows/wire-effects-melody.yml 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: real deck FX, expanded sounds, and melody overlay [dj-fx-melody-done]"
          git push
