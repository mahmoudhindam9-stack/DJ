# Temporary one-time wiring workflow. It will be removed after the source patch is committed.
name: Wire Real Deck FX
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[deck-fx-wired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch DJ deck controller
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/example/player/DJDeckController.kt')
          s = p.read_text(encoding='utf-8')
          old_import = 'import androidx.media3.exoplayer.ExoPlayer\n'
          new_import = '''import androidx.media3.exoplayer.ExoPlayer
import androidx.media3.exoplayer.DefaultRenderersFactory
import androidx.media3.exoplayer.audio.AudioSink
import androidx.media3.exoplayer.audio.DefaultAudioSink
import androidx.media3.common.util.UnstableApi
'''
          if 'DeckFxAudioProcessor' not in s:
              s = s.replace(old_import, new_import, 1)
          old_player = '''class DJDeck(context: Context, val deckName: String) {
    val exoPlayer: ExoPlayer = ExoPlayer.Builder(context).build()
'''
          new_player = '''@OptIn(UnstableApi::class)
class DJDeck(context: Context, val deckName: String) {
    private val fxProcessor = DeckFxAudioProcessor()

    private val renderersFactory = object : DefaultRenderersFactory(context) {
        override fun buildAudioSink(
            context: Context,
            enableFloatOutput: Boolean,
            enableAudioTrackPlaybackParams: Boolean
        ): AudioSink {
            return DefaultAudioSink.Builder(context)
                .setEnableFloatOutput(false)
                .setEnableAudioTrackPlaybackParams(enableAudioTrackPlaybackParams)
                .setAudioProcessors(arrayOf(fxProcessor))
                .build()
        }
    }

    val exoPlayer: ExoPlayer = ExoPlayer.Builder(context, renderersFactory).build()
'''
          if old_player in s:
              s = s.replace(old_player, new_player, 1)
          marker = '    var isCrushActive by mutableStateOf(false)\n'
          fx_methods = '''
    fun toggleFlanger() {
        isFlangerActive = !isFlangerActive
        fxProcessor.flangerEnabled = isFlangerActive
    }

    fun toggleReverb() {
        isReverbActive = !isReverbActive
        fxProcessor.reverbEnabled = isReverbActive
    }

    fun toggleEcho() {
        isEchoActive = !isEchoActive
        fxProcessor.echoEnabled = isEchoActive
    }

    fun toggleCrush() {
        isCrushActive = !isCrushActive
        fxProcessor.crushEnabled = isCrushActive
    }
'''
          if 'fun toggleFlanger()' not in s and marker in s:
              s = s.replace(marker, marker + fx_methods, 1)
          old_speed = '''    fun setPitchAndSpeed(newRate: Float) {
        pitchSpeed = newRate.coerceIn(0.5f, 1.5f)
        var effectiveSpeed = pitchSpeed
        if (isFlangerActive) {
            effectiveSpeed *= 1.02f
        }
        exoPlayer.playbackParameters = PlaybackParameters(effectiveSpeed, effectiveSpeed)
    }

    fun setDeckVolume(vol: Float) {
        volume = vol.coerceIn(0f, 1f)
        var effVol = volume
        if (isEchoActive) {
            effVol = (effVol * 1.15f).coerceAtMost(1f)
        }
        if (isCrushActive) {
            effVol *= 0.9f
        }
        exoPlayer.volume = effVol
    }
'''
          new_speed = '''    fun setPitchAndSpeed(newRate: Float) {
        pitchSpeed = newRate.coerceIn(0.5f, 1.5f)
        exoPlayer.playbackParameters = PlaybackParameters(pitchSpeed, pitchSpeed)
    }

    fun setDeckVolume(vol: Float) {
        volume = vol.coerceIn(0f, 1f)
        exoPlayer.volume = volume
    }
'''
          if old_speed in s:
              s = s.replace(old_speed, new_speed, 1)
          old_cross = '''        deckA.exoPlayer.volume = if (deckA.isEchoActive) (volA * 1.15f).coerceAtMost(1f) else volA
        deckB.exoPlayer.volume = if (deckB.isEchoActive) (volB * 1.15f).coerceAtMost(1f) else volB
'''
          new_cross = '''        deckA.exoPlayer.volume = volA
        deckB.exoPlayer.volume = volB
'''
          if old_cross in s:
              s = s.replace(old_cross, new_cross, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/player/DJDeckController.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: wire real deck FX into playback [deck-fx-wired]"
          git push
