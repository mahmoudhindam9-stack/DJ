name: Finalize DJ Features
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[dj-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final feature script
        run: python3 tools/finalize_dj.py
      - name: Commit sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/player/DJDeckController.kt app/src/main/java/com/example/player/DeckFxAudioProcessor.kt app/src/main/java/com/example/MainActivity.kt app/src/main/java/com/example/MelodyStudio.kt app/src/main/java/com/example/ExtraSoundPlayer.kt
          git rm -f tools/finalize_dj.py .github/workflows/finalize-dj-features.yml 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: finalize real DJ FX sound bank and melody studio [dj-finalized]"
          git push
